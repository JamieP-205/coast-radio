<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Station picture for radio directories, 1000 by 1000</title>
<!-- The square picture radio directories and apps show for Coast. Open this
     file at 1000 by 1000 and save a screenshot as
     public/images/station-square.jpg. -->
<link rel="stylesheet" href="link-preview.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 1000px;
    height: 1000px;
    padding: 0;
    background:
      repeating-linear-gradient(180deg, rgb(255 255 255 / 0.035) 0 14px, transparent 14px 28px),
      #14466b;
  }
  .photo {
    width: 540px;
    height: 540px;
    border-width: 10px;
  }
  .logo {
    width: 470px;
    margin-top: 64px;
  }
  .web {
    margin-top: 34px;
    font-size: 34px;
  }
</style>
</head>
<body>
  <img class="photo" src="../public/images/jim-studio-2014.webp" alt="">
  <img class="logo" src="../public/images/logo.svg" alt="Coast Internet Radio">
  <p class="web">coastinternetradio.com</p>
</body>
</html>
