# The website lives in public/. Everything else (the functions, tests and
# scripts) stays private and is never served to visitors.
[build]
  publish = "public"
  # Builds each page's own address, then runs the tests, so a change that
  # breaks them never goes live. The home page is trimmed last.
  command = "node scripts/build-pages.mjs && npm test && node scripts/build-pages.mjs --home"

[functions]
  directory = "netlify/functions"
